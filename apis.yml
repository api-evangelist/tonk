name: Tonk
description: >-
  Tonk, built by Tonk Labs, is an open-source containerized format, host environment, and
  protocol for multiplayer, local-first software you keep and share like files. A .tonk
  bundle packages an application together with its data into a single self-contained file
  that runs anywhere, works offline, and stays under user control. It is built on a
  document-based virtual file system using Automerge CRDTs, a browser/WebAssembly runtime
  compiled from Rust, and peer-to-peer synchronization through WebSocket relays. Tonk ships
  first-party npm client libraries, a CLI, a sync relay, an authentication library, and an
  MCP worker rather than a hosted REST API. Backed by Electric Capital.
